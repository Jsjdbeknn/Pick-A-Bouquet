<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick Your Bouquet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#ffe9f1;--bg2:#e9ebff;--bg3:#fff6dc;--ink:#4a3552;--soft:#8a7595;--card:rgba(255,255,255,.55)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1b3d;--bg2:#13152f;--bg3:#2b2140;--ink:#f6e9ff;--soft:#c3a9d6;--card:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg1:#2a1b3d;--bg2:#13152f;--bg3:#2b2140;--ink:#f6e9ff;--soft:#c3a9d6;--card:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));color:var(--ink);font-family:'Playfair Display',Georgia,serif;overflow:hidden}
.orb{position:fixed;border-radius:50%;opacity:.5}
.o1{width:40vmax;height:40vmax;background:radial-gradient(circle,#ff9bb8,transparent 68%);left:-10vmax;top:-12vmax}
.o2{width:34vmax;height:34vmax;background:radial-gradient(circle,#a9b9ff,transparent 68%);right:-8vmax;bottom:-10vmax;animation-delay:-5s}
.o3{width:26vmax;height:26vmax;background:radial-gradient(circle,#ffe27a,transparent 68%);left:40%;top:-8vmax;opacity:.35;animation-delay:-9s}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.15)}}
.petal{position:fixed;top:-30px;width:14px;height:18px;border-radius:70% 0 70% 0;opacity:.7;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg) translateX(80px)}}
.spark{position:fixed;width:6px;height:6px;background:#fff;border-radius:50%;box-shadow:0 0 10px 3px #fff;animation:tw 3s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.9;transform:scale(1)}}
.stage{position:relative;height:100%;width:100%}
.title{position:absolute;top:4vh;left:0;right:0;text-align:center;z-index:10;transition:opacity .6s,transform .6s}
.title h1{margin:0;font-size:clamp(24px,4.6vh,46px);font-weight:700;letter-spacing:.5px}
.title p{margin:2px 0 0;font-family:'Caveat',cursive;font-size:clamp(20px,3.6vh,32px);color:var(--soft)}
.picked .title{opacity:0;transform:translateY(-20px);pointer-events:none}
.b{position:absolute;top:52%;left:calc(12.5% + 25% * var(--i));width:min(20vw,38vh);transform:translate(-50%,-50%);cursor:pointer;transition:left 1.1s cubic-bezier(.65,0,.25,1),top 1.1s cubic-bezier(.65,0,.25,1),transform 1.1s cubic-bezier(.65,0,.25,1),opacity .7s}
.b svg{width:100%;height:auto;display:block;overflow:visible;transform-origin:50% 92%;animation:sway 4.5s ease-in-out infinite;will-change:transform}
.b:nth-child(5) svg{animation-delay:-1s}.b:nth-child(6) svg{animation-delay:-2s}.b:nth-child(7) svg{animation-delay:-3s}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.b .nm{text-align:center;font-family:'Caveat',cursive;font-size:clamp(20px,3.6vh,32px);margin-top:4px;transition:opacity .5s}
.b:hover{transform:translate(-50%,-53%) scale(1.07)}
.glow{position:absolute;left:50%;top:44%;width:130%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.5);border-radius:50%;background:radial-gradient(circle,var(--g) 0%,transparent 65%);opacity:0;transition:opacity 1s,transform 1.2s;z-index:-1}
.fl{transform-box:fill-box;transform-origin:center;animation:none}
@keyframes pulse{50%{transform:scale(1.035) rotate(1.5deg)}}
.picked .b{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.6)}
.picked .b.sel{opacity:1;pointer-events:none;left:29%;top:50%;transform:translate(-50%,-50%) scale(1.6)}
.picked .b.sel .glow{opacity:.75;transform:translate(-50%,-50%) scale(1)}
.picked .b.sel svg{animation-duration:3s}
.back{position:absolute;left:3vw;top:4vh;z-index:20;font-family:'Caveat',cursive;font-size:clamp(20px,3.4vh,28px);padding:6px 18px;border-radius:30px;border:1.5px solid var(--soft);background:var(--card);color:var(--ink);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s .9s}
.picked .back{opacity:1;pointer-events:auto}
.hint{position:absolute;bottom:4vh;left:0;right:0;text-align:center;font-family:'Caveat',cursive;font-size:clamp(20px,3.6vh,30px);color:var(--soft);transition:opacity .4s}
.envbox{--u:min(1.7vw,3vh);font-size:var(--u);position:absolute;right:7vw;top:60%;width:20em;height:13em;transform:translate(14em,-50%);opacity:0;pointer-events:none;transition:transform 1.1s cubic-bezier(.2,1,.3,1) .5s,opacity .8s .5s,top 1s ease}
.picked .envbox{transform:translate(0,-50%);opacity:1;pointer-events:auto}
.picked .envbox.open{top:72%}
.env{position:absolute;inset:0;cursor:pointer;animation:bob 3s ease-in-out infinite}
.open .env{animation:none}
@keyframes bob{50%{transform:translateY(-.5em) rotate(-.8deg)}}
.eback{position:absolute;inset:0;background:#f1bd98;border-radius:.5em;box-shadow:0 1em 1.4em rgba(120,60,90,.35)}
.letter{position:absolute;left:1.5em;right:1.5em;bottom:.5em;height:14em;font-size:.8em;line-height:1.3em;background:linear-gradient(transparent calc(1.3em - 1px),#e8dcc8 0) 0 .4em/100% 1.3em,#fffdf5;border-radius:.4em;padding:.9em 1.2em;text-align:left;font-family:'Caveat',cursive;font-weight:500;color:#4a3552;box-shadow:0 2px 10px rgba(0,0,0,.15);overflow:hidden;z-index:2}
.open .letter{animation:letterOut 2.3s cubic-bezier(.45,0,.25,1) .75s both}
.closing .letter{animation:letterIn 1.7s cubic-bezier(.45,0,.25,1) both}
@keyframes letterOut{0%{transform:translateY(0) scale(1);z-index:2}58%{transform:translateY(-16em) scale(1);z-index:2}59%{transform:translateY(-16em) scale(1);z-index:6}100%{transform:translateY(-11em) scale(1.22);z-index:6}}
@keyframes letterIn{0%{transform:translateY(-11em) scale(1.22);z-index:6}41%{transform:translateY(-16em) scale(1);z-index:6}42%{transform:translateY(-16em) scale(1);z-index:2}100%{transform:translateY(0) scale(1);z-index:2}}
.letter h3{margin:0;font-size:1.4em;font-weight:700;line-height:1.3em}
.sig{text-align:right;font-weight:700;font-size:1.15em}
.front{position:absolute;inset:0;z-index:3;pointer-events:none}
.front:before,.front:after,.front i{content:"";position:absolute;inset:0;border-radius:.5em}
.front:before{background:#f0b48e;clip-path:polygon(0 0,50% 58%,0 100%)}
.front:after{background:#ebaa82;clip-path:polygon(100% 0,50% 58%,100% 100%)}
.front i{background:#e69d73;clip-path:polygon(0 100%,50% 52%,100% 100%)}
.flap{position:absolute;top:0;left:0;width:100%;height:60%;background:linear-gradient(#e8a37a,#dd9167);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease 1.7s,z-index 0s 2.05s;z-index:4}
.open .flap{transform:rotateX(180deg);z-index:1;transition:transform .8s ease 0s,z-index 0s .4s}
.seal{position:absolute;left:50%;top:50%;width:2.6em;height:2.6em;margin:-1.3em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a8a,#c4162f);z-index:5;display:grid;place-items:center;color:#fff;font-size:1.3em;box-shadow:0 .2em .5em rgba(0,0,0,.3);transition:opacity .4s 2.5s,transform .5s 2.5s}
.open .seal{opacity:0;transform:scale(.2) rotate(90deg);transition:opacity .3s,transform .5s}
.tap{position:absolute;left:0;right:0;bottom:-3.2em;text-align:center;font-family:'Caveat',cursive;font-size:1.5em;color:var(--soft)}
@media (orientation:portrait){.rot{display:block}}
.rot{display:none;position:fixed;bottom:10px;left:0;right:0;text-align:center;font-family:'Caveat',cursive;font-size:20px;color:var(--soft);z-index:30}
.pics{position:absolute;left:51.5vw;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:3vh;pointer-events:none;z-index:5}
.pol{--s:min(11vw,24vh);width:var(--s);background:#fff;padding:calc(var(--s)*.05) calc(var(--s)*.05) calc(var(--s)*.16);border-radius:3px;box-shadow:0 1.2vh 3vh rgba(60,20,70,.35);opacity:0;transform:translateY(-4vh) scale(.7) rotate(var(--r));transition:opacity .4s,transform .5s;position:relative}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pol:before{content:"";position:absolute;top:-1.2vh;left:50%;width:35%;height:2.4vh;background:rgba(255,226,140,.8);transform:translateX(-50%) rotate(-3deg)}
.reading .pol{opacity:1;transform:rotate(var(--r));transition:opacity .7s 3s,transform 1s cubic-bezier(.2,1.3,.4,1) 3s}
.reading .pol:nth-child(2){transition-delay:3.4s}
.st{transform-box:fill-box;transform-origin:center;animation:none}
.picked .b:not(.sel) svg{animation:none}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="stage" id="stage">
  <div class="title"><h1>🌸 A Bouquet For You 🌸</h1><p>I know u hate flowers po but, why not? bwhehe I love you!</p></div>
  <button class="back" id="back">← choose another</button>
  <div class="hint" id="hint">Pili kapo baby! ✨</div>
  <div class="pics" id="pics"></div>
  <div class="envbox" id="ew">
    <div class="env" id="env">
      <div class="eback"></div>
      <div class="letter" id="letter"></div>
      <div class="front"><i></i></div>
      <div class="flap"></div>
      <div class="seal">♥</div>
    </div>
    <div class="tap" id="tap">Tap the envelope to open 💌</div>
  </div>
</div>
<div class="rot">📱 Rotate your phone to landscape for the best view</div>
<script>
const B=[
{n:'Blue Skies',c:'#8db7ff',d:'#2a58cc',g:'rgba(110,160,255,.7)',p:6,k:'calm, trust and endless sky'},
{n:'Red Roses',c:'#ff6f85',d:'#a50f2b',g:'rgba(255,90,120,.7)',p:8,k:'deep love and warmth'},
{n:'Violet Dreams',c:'#c3a4ff',d:'#5a2fc4',g:'rgba(170,120,255,.7)',p:5,k:'wonder, wisdom and magic'},
{n:'Golden Sunshine',c:'#fff08a',d:'#f0a000',g:'rgba(255,215,70,.8)',p:10,k:'joy and bright sunshine'}];
function mix(a,b,t){const f=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const x=f(a),y=f(b);return'#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function bez(a,c,e,t){const u=1-t;return[u*u*a[0]+2*u*t*c[0]+t*t*e[0],u*u*a[1]+2*u*t*c[1]+t*t*e[1]]}
const W='#ffffff';
function leaf(x,y,rot,len){return`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot})"><path d="M0 0C${-len*.35} ${-len*.3} ${-len*.3} ${-len*.8} 0 ${-len}C${len*.3} ${-len*.8} ${len*.35} ${-len*.3} 0 0Z" fill="#5cb874" stroke="#2f7d49" stroke-width=".7"/><path d="M0 0V${-len*.85}" stroke="#2f7d49" stroke-width=".7" opacity=".7"/></g>`}
function bloom(r,b,cc){
  let s='';
  for(let k=0;k<8;k++)s+=`<g transform="rotate(${k*45})"><ellipse cy="${-r*.55}" rx="${r*.34}" ry="${r*.56}" fill="${b.c}" stroke="${b.d}" stroke-width="1"/><path d="M0 ${-r*.25}V${-r*.95}" stroke="${b.d}" stroke-width=".7" opacity=".4"/><ellipse cy="${-r*.82}" rx="${r*.07}" ry="${r*.15}" fill="#fff" opacity=".4"/></g>`;
  for(let k=0;k<8;k++)s+=`<ellipse cy="${-r*.38}" rx="${r*.24}" ry="${r*.38}" fill="${mix(b.c,W,.55)}" stroke="${b.d}" stroke-width=".7" transform="rotate(${k*45+22.5})"/>`;
  s+=`<circle r="${r*.24}" fill="${cc}" stroke="${b.d}" stroke-width=".8"/>`;
  for(let k=0;k<7;k++)s+=`<circle cx="${(Math.cos(k*.9)*r*.13).toFixed(1)}" cy="${(Math.sin(k*.9)*r*.13).toFixed(1)}" r="${r*.03}" fill="${b.d}" opacity=".6"/>`;
  return s}
function tulip(r,b){
  const P=(w,h,rot,fill)=>`<path d="M0 0C${-w} ${-h*.3} ${-w} ${-h*.8} 0 ${-h}C${w} ${-h*.8} ${w} ${-h*.3} 0 0Z" fill="${fill}" stroke="${b.d}" stroke-width="1" transform="rotate(${rot})"/>`;
  return P(r*.7,r*2,-26,mix(b.c,b.d,.5))+P(r*.7,r*2,26,mix(b.c,b.d,.5))+P(r*.78,r*2.1,0,b.c)+`<path d="M${-r*.2} ${-r*.4}Q${-r*.3} ${-r*1.2} ${-r*.05} ${-r*1.8}" stroke="#fff" stroke-opacity=".45" stroke-width="${r*.12}" fill="none" stroke-linecap="round"/>`+`<path d="M0 0C${-r*.5} ${r*.1} ${-r*.5} ${r*.4} 0 ${r*.5}C${r*.5} ${r*.4} ${r*.5} ${r*.1} 0 0Z" fill="#4fae68" stroke="#2f7d49" stroke-width=".6"/>`}
function daisy(r,b,cc){
  let s='';
  for(let k=0;k<10;k++)s+=`<ellipse cy="${-r*.55}" rx="${r*.2}" ry="${r*.5}" fill="${mix(b.c,W,.78)}" stroke="${b.c}" stroke-width=".8" transform="rotate(${k*36})"/>`;
  return s+`<circle r="${r*.3}" fill="${cc}" stroke="${b.d}" stroke-width=".7"/><circle cx="${-r*.08}" cy="${-r*.08}" r="${r*.08}" fill="#fff" opacity=".6"/>`}
function bud(r,b){return`<path d="M0 0C${-r} ${-r*.6} ${-r*.8} ${-r*1.8} 0 ${-r*2.4}C${r*.8} ${-r*1.8} ${r} ${-r*.6} 0 0Z" fill="${b.c}" stroke="${b.d}" stroke-width="1"/><path d="M0 ${-r*.2}Q${-r*.3} ${-r*1.2} 0 ${-r*2}" stroke="#fff" stroke-opacity=".5" fill="none"/><path d="M${-r*.9} ${r*.1}Q0 ${r*.9} ${r*.9} ${r*.1}Q0 ${-r*.5} ${-r*.9} ${r*.1}Z" fill="#4fae68" stroke="#2f7d49" stroke-width=".6"/>`}
function sprig(x1,y1,bend){
  const a=[100,185],c=[(100+x1)/2+bend,(185+y1)/2],e=[x1,y1];
  let s=`<path d="M100 185Q${c[0]} ${c[1]} ${x1} ${y1}" stroke="#4f9a62" stroke-width="1.6" fill="none"/>`;
  for(let n=0,t=.35;t<=1.01;t+=.2,n++){const p=bez(a,c,e,t),sd=n%2?1:-1;s+=`<circle cx="${(p[0]+sd*5).toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.8" fill="#a9cfb7" stroke="#6fa585" stroke-width=".6"/>`}
  return s}
function bouquet(b,idx){
  const i=idx,cc=i==3?'#c46a10':'#ffd23f';
  const defs=`<pattern id="pt${i}" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="${mix(b.c,W,.86)}"/><circle cx="3" cy="3" r="1.5" fill="${b.c}" opacity=".6"/><circle cx="9" cy="9" r="1.5" fill="${b.c}" opacity=".6"/></pattern>`;
  let g='';
  [[18,70,-10],[182,70,10],[58,6,-6],[142,6,6]].forEach(a=>g+=sprig(a[0],a[1],a[2]));
  [[12,40],[188,40],[48,52],[152,52],[100,10],[30,76],[170,76]].forEach(p=>{
    g+=`<path d="M${p[0]} ${p[1]}Q${(p[0]+100)/2} ${(p[1]+185)/2} 100 185" stroke="#6fb583" stroke-width=".8" fill="none" opacity=".6"/>`;
    for(let k=0;k<6;k++){const a=k*1.05;g+=`<circle cx="${(p[0]+Math.cos(a)*3.6).toFixed(1)}" cy="${(p[1]+Math.sin(a)*3.6).toFixed(1)}" r="2.1" fill="#fff" stroke="#e6e6f0" stroke-width=".4"/>`}});
  const F=[['d',70,28,10],['d',130,28,10],['u',48,40,6],['u',152,40,6],['t',100,50,14],['d',22,58,11],['d',178,58,11],['t',34,84,13],['t',166,84,13],['b',62,66,22],['b',138,66,22],['b',100,78,24],['d',22,102,12],['d',178,102,12],['b',36,116,20],['b',164,116,20],['b',72,112,22],['b',128,112,22],['b',100,128,21],['d',54,136,11],['d',146,136,11]];
  let st='',fl='';
  F.forEach((f,k)=>{
    const x=f[1],y=f[2],c=[100+(x-100)*.35,y+(185-y)*.5];
    st+=`<path d="M100 185Q${c[0]} ${c[1]} ${x} ${y}" stroke="#2f7d49" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M100 185Q${c[0]} ${c[1]} ${x} ${y}" stroke="#4fae68" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    if(f[0]=='t'){const p=bez([100,185],c,[x,y],.55);st+=leaf(p[0],p[1],x<100?-58:58,17)}
    const body=f[0]=='b'?bloom(f[3],b,cc):f[0]=='t'?tulip(f[3],b):f[0]=='d'?daisy(f[3],b,cc):bud(f[3],b);
    fl+=`<g transform="translate(${x} ${y})"><g class="fl" style="animation-delay:${-k*.45}s">${body}</g></g>`});
  let sp='';[[14,16],[186,22],[98,3],[62,48],[140,46]].forEach((p,k)=>sp+=`<path class="st" style="animation-delay:${-k*.7}s" transform="translate(${p[0]} ${p[1]})" d="M0 -7L1.8 -1.8L7 0L1.8 1.8L0 7L-1.8 1.8L-7 0L-1.8 -1.8Z" fill="#ffe27a"/>`);
  const back=`<path d="M12 98Q14 150 58 164L70 254H130L142 164Q186 150 188 98Q148 142 100 144Q52 142 12 98Z" fill="${mix(b.c,W,.5)}" stroke="${mix(b.c,b.d,.4)}" stroke-width="1"/><path d="M12 98Q52 142 100 144Q148 142 188 98" fill="none" stroke="${mix(b.c,W,.15)}" stroke-width="2" opacity=".7"/>`;
  const wrap=`<path d="M38 156Q100 190 162 156L130 254H70Z" fill="url(#pt${i})" stroke="${mix(b.c,b.d,.4)}" stroke-width="1"/>
  <path d="M38 156Q100 190 162 156L100 214Z" fill="${mix(b.c,W,.35)}" stroke="${mix(b.c,b.d,.4)}" stroke-width="1"/>
  <path d="M100 214L72 254M100 214L128 254" stroke="${mix(b.c,b.d,.4)}" stroke-width=".8" opacity=".6"/>
  <path d="M62 198Q100 212 138 198L136 210Q100 224 64 210Z" fill="${b.d}"/>
  <path d="M96 212C86 232 76 246 60 258L80 254L88 260C94 242 100 228 104 214Z" fill="${b.d}" stroke="${mix(b.d,'#000000',.25)}" stroke-width=".6"/><path d="M104 212C114 232 124 246 140 258L120 254L112 260C106 242 100 228 96 214Z" fill="${b.d}" stroke="${mix(b.d,'#000000',.25)}" stroke-width=".6"/>
  <path d="M100 206C64 178 44 214 76 222C90 225 98 214 100 206Z" fill="${b.d}" stroke="${mix(b.d,'#000000',.25)}" stroke-width=".7"/><path d="M100 206C136 178 156 214 124 222C110 225 102 214 100 206Z" fill="${b.d}" stroke="${mix(b.d,'#000000',.25)}" stroke-width=".7"/>
  <path d="M96 205C78 192 64 206 80 215M104 205C122 192 136 206 120 215" stroke="${mix(b.d,W,.55)}" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="100" cy="208" rx="8" ry="7" fill="${mix(b.d,'#000000',.15)}"/><ellipse cx="97" cy="205" rx="2.8" ry="2" fill="#fff" opacity=".5"/>`;
  return `<div class="b" style="--i:${idx};--g:${b.g}" data-i="${idx}"><div class="glow"></div><svg viewBox="0 0 200 262"><defs>${defs}</defs>${back}${g}${st}${fl}${wrap}${sp}</svg><div class="nm">${b.n}</div></div>`;
}

  letter.innerHTML=`<h3 style="color:${b.d}">${H[pick]}</h3>${L[pick]}<div class="sig">- Justin</div>`;
  document.getElementById('pics').innerHTML=PH[pick].map((u,i)=>`<div class="pol" style="--r:${i?5:-5}deg"><img src="${u}" alt=""></div>`).join('');
}
stage.addEventListener('click',e=>{
  const el=e.target.closest('.b');if(!el||pick!==null)return;
  pick=+el.dataset.i;el.classList.add('sel');stage.classList.add('picked');
  hint.style.opacity=0;writeLetter();
});
document.getElementById('env').addEventListener('click',()=>{
  setOpen(!ew.classList.contains('open'));
});
function setOpen(o){stage.classList.toggle('reading',o);
  if(o){ew.classList.remove('closing');ew.classList.add('open');}
  else if(ew.classList.contains('open')){ew.classList.remove('open');ew.classList.add('closing');}
  tap.textContent=o?'Tap to close':'Tap the envelope to open 💌';
}
letter.addEventListener('animationend',e=>{if(e.animationName==='letterIn')ew.classList.remove('closing');});
document.getElementById('back').addEventListener('click',()=>{
  setOpen(false);
  stage.classList.remove('picked');
  document.querySelectorAll('.b').forEach(x=>x.classList.remove('sel'));
  pick=null;setTimeout(()=>hint.style.opacity=1,900);
});
const cols=['#5b95ff','#f0405a','#a275ff','#ffd33f'];
for(let i=0;i<9;i++){const p=document.createElement('div');p.className='petal';
  p.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%4]};animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*14}s;scale:${.6+Math.random()}`;
  document.body.appendChild(p);}
for(let i=0;i<7;i++){const s=document.createElement('div');s.className='spark';
  s.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*100}vh;animation-delay:${-Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
  document.body.appendChild(s);}
</script>
</body>
